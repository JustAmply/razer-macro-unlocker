name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  razer-app-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Download verified desktop adapter
        shell: pwsh
        run: ./scripts/setup-razer-app.ps1
      - name: Run RazerMacroUnlocker regression tests
        run: dotnet run --project tests/RazerMacroUnlocker.Tests -c Release
      - name: Build RazerMacroUnlocker
        shell: pwsh
        run: ./scripts/build-razer-app.ps1
      - name: Upload application preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RazerMacroUnlocker-preview-windows-x64
          path: dist/RazerMacroUnlocker/
          if-no-files-found: error
          retention-days: 7

  windows-tests:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Run Windows API contract tests
        run: python -m unittest discover -s tests -v
